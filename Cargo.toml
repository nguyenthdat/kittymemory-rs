[package]
name = "kittymemory-rs"
version = "0.4.0"
edition = "2021"
authors = ["Rodroid Dev"]
description = "Rust bindings for KittyMemory, plus the AArch64 inline hook used by libysmteam.so"
license = "MIT"
repository = "https://github.com/rodroidmods/kittymemory-rs"
documentation = "https://docs.rs/kittymemory-rs"
keywords = ["memory", "android", "ios", "ffi"]
categories = ["external-ffi-bindings", "game-development"]
readme = "README.md"
include = [
    "src/**/*",
    "examples/**/*",
    "build.rs",
    "wrapper.h",
    "wrapper.cpp",
    "kittymemory_fix.hpp",
    "bindings.rs",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "0.70"
cc = "1.0"

[features]
default = []
# KittyMemory's C++ wrapper (`safe::*`, `sys::*`). Off by default: the hook engine is pure Rust, and
# leaving it out keeps libc++ out of the final library entirely.
cxx = []
keystone = []
android = []
ios = []

# The examples drive KittyMemory's C++ API, so they need the optional wrapper.
[[example]]
name = "usage"
required-features = ["cxx"]

[[example]]
name = "advanced_features"
required-features = ["cxx"]

[lib]
name = "kittymemory"
path = "src/lib.rs"
# crate-type = ["staticlib", "cdylib"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.release.package."*"]
opt-level = 3
codegen-units = 1
strip = true
debug = false
overflow-checks = false
